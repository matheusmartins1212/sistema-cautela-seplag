<line x1="542" y1="394" x2="576" y2="394" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="578" y1="414" x2="544" y2="414" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M298 144 L280 144 L280 402 L298 402" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="60" y="245" width="180" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="150.0" y="264" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">Cancelada</text><text x="150.0" y="283" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">Pelo admin, fase ativa</text>
<line x1="280" y1="273" x2="244" y2="273" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="60" y="548" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="80" y="555" dominant-baseline="central" font-size="12" fill="#444441">Etapas do fluxo</text>
<rect x="211" y="548" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="231" y="555" dominant-baseline="central" font-size="12" fill="#444441">Encerramento normal</text>
<rect x="390" y="548" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/><text x="410" y="555" dominant-baseline="central" font-size="12" fill="#444441">Atenção</text>
<rect x="485" y="548" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="505" y="555" dominant-baseline="central" font-size="12" fill="#444441">Volta ao servidor</text>
<rect x="650" y="548" width="14" height="14" rx="3" fill="#FCEBEB" stroke="#A32D2D"/><text x="670" y="555" dominant-baseline="central" font-size="12" fill="#444441">Saída do fluxo</text>
</svg>
