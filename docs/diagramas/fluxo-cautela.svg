<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" font-family="Inter, 'DejaVu Sans', sans-serif">
<title>Fluxo da solicitação e da cautela (com correções)</title><desc>Fluxo após as correções: atraso ainda permite devolver e a retificação volta ao servidor.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="600" fill="#FFFFFF"/>
<rect x="300" y="30" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="420.0" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Solicitação</text><text x="420.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Pendente de análise</text>
<rect x="300" y="116" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="420.0" y="135" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Aguardando retirada</text><text x="420.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Aprovada, carro reservado</text>
<rect x="300" y="202" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="420.0" y="221" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Retirada em andamento</text><text x="420.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Checklist de retirada aberto</text>
<rect x="300" y="288" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="420.0" y="307" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Em uso</text><text x="420.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Retirada enviada</text>
<rect x="300" y="374" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="420.0" y="393" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Devolução em análise</text><text x="420.0" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Devolução enviada</text>
<rect x="300" y="460" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="420.0" y="479" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Finalizada</text><text x="420.0" y="498" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Com ou sem observação</text>
<line x1="420.0" y1="88" x2="420.0" y2="112" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="420.0" y1="174" x2="420.0" y2="198" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="420.0" y1="260" x2="420.0" y2="284" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="420.0" y1="346" x2="420.0" y2="370" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="420.0" y1="432" x2="420.0" y2="456" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="580" y="30" width="180" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="670.0" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">Encerrada</text><text x="670.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">Recusada ou cancelada</text>
<line x1="542" y1="58" x2="576" y2="58" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
